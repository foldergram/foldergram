worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  aio threads;
  keepalive_timeout 65;
  keepalive_requests 1000;

  # Keep hot original-file descriptors available without caching video bytes in RAM.
  open_file_cache max=4000 inactive=30s;
  open_file_cache_valid 60s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  upstream foldergram_web {
    server foldergram-web:4141;
    keepalive 32;
  }

  server {
    listen 8080;
    server_name _;
    client_max_body_size 64m;

    # Node authorizes /api/originals/:id, then emits X-Accel-Redirect here.
    # This path is internal, so a client cannot bypass the application session.
    location /__foldergram_media/ {
      internal;
      alias /app/data/gallery/;
      add_header Accept-Ranges bytes always;
      add_header Cache-Control "private, no-store" always;
    }

    location / {
      proxy_pass http://foldergram_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";

      # Preserve native Range semantics and avoid proxy buffering a media response.
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
