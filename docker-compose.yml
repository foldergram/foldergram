services:
  foldergram:
    image: ghcr.io/foldergram/foldergram:latest
    ports:
      - "4141:4141"
    environment:
      IMAGE_DETAIL_SOURCE: preview
      DERIVATIVE_MODE: eager
      VIDEO_DELIVERY_MODE: ${VIDEO_DELIVERY_MODE:-streaming}
      HLS_CACHE_DIR: ${HLS_CACHE_DIR:-/app/data/hls-cache}
      HLS_CACHE_MAX_BYTES: "${HLS_CACHE_MAX_BYTES:-2147483648}"
      HLS_CACHE_MAX_AGE_HOURS: "${HLS_CACHE_MAX_AGE_HOURS:-24}"
      HLS_TRANSCODE_CONCURRENCY: "${HLS_TRANSCODE_CONCURRENCY:-1}"
      # Optional Immich integration: see docs/immich.md for explicit roots/albums and Docker secrets.
      # IMMICH_URL: http://immich-server:2283
      # IMMICH_API_KEY_FILE: /run/secrets/immich_api_key
      # Persist data/db/immich-encryption.key with the database.
      # Optional: skip specific source folders by name or by exact relative path.
      # GALLERY_EXCLUDED_FOLDERS: "@eaDir,thumbnails,Archive/cache"
      # Optional: enable read-only public demo behavior.
      # PUBLIC_DEMO_MODE: "1"
      # Optional when the browser-visible origin differs from the upstream Node host.
      # CSRF_TRUSTED_ORIGINS: https://foldergram.example.com
    volumes:
      - ./data/gallery:/app/data/gallery
      # Optional: mount additional locations, then add the container paths in Settings > Sources.
      # - /home/alex/Pictures:/sources/pictures:ro
      # - /mnt/external/Photos:/sources/external:ro
      - ./data/db:/app/data/db
      - ./data/thumbnails:/app/data/thumbnails
      - ./data/previews:/app/data/previews
      - ./data/hls-cache:/app/data/hls-cache
    restart: unless-stopped
