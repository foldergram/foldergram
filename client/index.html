<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Foldergram" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Foldergram</title>
    <script>
      // Match the startup screen to the saved theme before the app loads.
      (function () {
        var theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
          var savedTheme = window.localStorage.getItem('foldergram-theme');
          if (savedTheme === 'light' || savedTheme === 'dark') theme = savedTheme;
        } catch (_) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      /* ── Splash screen — shown before Vue boots ──────────────────── */
      #fg-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f5f7;
        z-index: 99999;
      }
      :root[data-theme="dark"] #fg-splash {
        background: #0d1014;
      }
      .fg-splash__logo {
        width: 96px;
        height: 96px;
      }
    </style>
  </head>
  <body>
    <!-- Branded splash: visible immediately, removed once Vue mounts -->
    <div id="fg-splash" aria-hidden="true">
      <svg class="fg-splash__logo" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="fgSplashGrad" x1="2" y1="2" x2="18" y2="18" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#6366F1" />
            <stop offset="50%"  stop-color="#8B5CF6" />
            <stop offset="100%" stop-color="#EC4899" />
          </linearGradient>
        </defs>
        <path
          d="M2 4.5A2.5 2.5 0 0 1 4.5 2h11A2.5 2.5 0 0 1 18 4.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 2 15.5v-11zM4.5 3A1.5 1.5 0 0 0 3 4.5v11A1.5 1.5 0 0 0 4.5 17h11a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 15.5 3h-11zM5 6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6zm3 0H6v2h2V6zm-3 6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-2zm3 0H6v2h2v-2zm3-6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V6zm3 0h-2v2h2V6zm-3 6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-2zm3 0h-2v2h2v-2z"
          fill="url(#fgSplashGrad)"
          stroke="url(#fgSplashGrad)"
          stroke-width="0.2"
          stroke-linejoin="round"
        />
      </svg>

    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Remove the startup screen once Vue has rendered its first element.
      (function () {
        var splash = document.getElementById('fg-splash');
        var app = document.getElementById('app');
        if (!splash || !app) return;
        var observer = new MutationObserver(function () {
          if (app.childElementCount > 0) {
            observer.disconnect();
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                splash.remove();
              });
            });
          }
        });
        observer.observe(app, { childList: true });
      })();
    </script>
  </body>
</html>
